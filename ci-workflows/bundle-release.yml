name: Build Release Android App Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Build Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for Capacitor web assets)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies & Build Web Assets
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci || npm install
            else
              npm install
            fi
            npm run build
            if npx cap --version >/dev/null 2>&1; then
              npx cap sync android
            fi
          fi

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execution permissions to the Gradle wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Build Release Android App Bundle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease
          elif [ -d "./android" ]; then
            cd android
            ./gradlew bundleRelease
          else
            echo "Error: Gradle wrapper not found" && exit 1
          fi

      - name: Upload Release Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            **/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
