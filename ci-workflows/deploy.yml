name: Deploy Standalone PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'android/**'
      - '.github/workflows/bundle-release.yml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

# Grants write permissions to push compiled site to gh-pages branch
permissions:
  contents: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "Lockfile desync detected, falling back to npm install..." && npm install)
          else
            npm install
          fi

      - name: Generate PWA Icons & Build Static Site
        run: |
          node generate-icons.js
          npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
