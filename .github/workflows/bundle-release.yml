name: Build Release Android App Bundle (Play Console)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release versionName (optional, e.g. 1.0.5)'
        required: false
        type: string
      version_code:
        description: 'Release integer versionCode (optional, auto-increments by default)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Ensure concurrent runs do not conflict
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Build Signed Play Console AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Prepare Android SDK 36 + NDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a532e303d725c4b378b164a3767" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;35.0.0" "build-tools;34.0.0" || true

          # Resolve pre-installed Android NDK (or install NDK 27 LTS) for native debug symbols extraction
          RESOLVED_NDK=""
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "${ANDROID_NDK_LATEST_HOME}" ]; then
            RESOLVED_NDK="${ANDROID_NDK_LATEST_HOME}"
          elif [ -d "$ANDROID_HOME/ndk" ]; then
            RESOLVED_NDK=$(ls -1d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$RESOLVED_NDK" ] || [ ! -d "$RESOLVED_NDK" ]; then
            echo "Installing Android NDK 27.2.12479018 for Play Console native debug symbols..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" || true
            RESOLVED_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          if [ -d "$RESOLVED_NDK" ]; then
            echo "Using Android NDK at: $RESOLVED_NDK"
            echo "ANDROID_NDK_PATH=${RESOLVED_NDK}" >> $GITHUB_ENV
          fi

      - name: Install NPM Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || (echo "Lockfile desync detected, falling back to npm install..." && npm install)
          else
            npm install
          fi

      - name: Generate PWA Assets & Build Production Web Dist
        run: |
          node generate-icons.js
          npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Verify Google Play App Signing Certificates (com.receiptscannerpro.app)
        run: |
          CERT_DIR="${GITHUB_WORKSPACE}/android/signing/play-store-certs"
          EXPECTED_DEPLOY_SHA1="AA:14:BE:52:28:F8:80:7C:13:DE:D0:86:F1:11:6A:0F:AE:93:17:4D"
          EXPECTED_DEPLOY_SHA256="47:4A:47:3D:23:74:45:84:40:9F:FD:15:F5:E5:ED:FD:8E:C0:0A:27:67:6D:52:4F:41:D1:FA:3B:DC:A6:2E:19"

          for cert_file in deployment_cert.der hybrid_classical_cert.der hybrid_pqc_cert.der; do
            if [ ! -f "${CERT_DIR}/${cert_file}" ]; then
              echo "ERROR: Missing Play Store certificate ${CERT_DIR}/${cert_file}"
              exit 1
            fi
          done

          ACTUAL_SHA1=$(openssl x509 -inform DER -in "${CERT_DIR}/deployment_cert.der" -noout -fingerprint -sha1 | cut -d'=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d ' \r\n')
          ACTUAL_SHA256=$(openssl x509 -inform DER -in "${CERT_DIR}/deployment_cert.der" -noout -fingerprint -sha256 | cut -d'=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d ' \r\n')

          if [ "$ACTUAL_SHA1" != "$EXPECTED_DEPLOY_SHA1" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_DEPLOY_SHA256" ]; then
            echo "ERROR: deployment_cert.der fingerprint mismatch! Got SHA1=${ACTUAL_SHA1}, SHA256=${ACTUAL_SHA256}"
            exit 1
          fi

          grep -q '"package_name": "com.receiptscannerpro.app"' "${GITHUB_WORKSPACE}/dist/.well-known/assetlinks.json"
          grep -q "$EXPECTED_DEPLOY_SHA256" "${GITHUB_WORKSPACE}/dist/.well-known/assetlinks.json"
          echo "Verified Google Play App Signing certificates (SHA1: ${ACTUAL_SHA1}) and Digital Asset Links!"

      - name: Configure Version & Play Store Release Signing Keystore
        id: signing_setup
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          # 1. Compute strictly increasing Play Console versionCode (>= 114) & versionName
          MIN_VERSION_CODE=114
          if [ -n "$INPUT_VERSION_CODE" ]; then
            COMPUTED_VC="$INPUT_VERSION_CODE"
          else
            COMPUTED_VC=$((100 + GITHUB_RUN_NUMBER))
            if [ "$COMPUTED_VC" -lt "$MIN_VERSION_CODE" ]; then
              COMPUTED_VC="$MIN_VERSION_CODE"
            fi
          fi

          if [ -n "$INPUT_VERSION_NAME" ]; then
            COMPUTED_VN="$INPUT_VERSION_NAME"
          else
            COMPUTED_VN="1.0.$((COMPUTED_VC - 100))"
          fi

          echo "ANDROID_VERSION_CODE=${COMPUTED_VC}" >> $GITHUB_ENV
          echo "ANDROID_VERSION_NAME=${COMPUTED_VN}" >> $GITHUB_ENV
          echo "version_code=${COMPUTED_VC}" >> $GITHUB_OUTPUT
          echo "version_name=${COMPUTED_VN}" >> $GITHUB_OUTPUT

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/android/upload-keystore.jks"
          REPO_KEYSTORE_FILE=$(find "${GITHUB_WORKSPACE}/android/signing" -maxdepth 1 -type f \( -name "*.jks" -o -name "*.keystore" -o -name "*.p12" -o -name "*.pfx" \) 2>/dev/null | head -n 1 || true)

          resolve_keystore_alias_and_sha1() {
            local ks_file="$1"
            local ks_pw="$2"
            local preferred_alias="$3"

            if ! keytool -list -keystore "$ks_file" -storepass "$ks_pw" >/dev/null 2>&1; then
              echo "ERROR: Could not unlock keystore with ANDROID_KEYSTORE_PASSWORD. Check your password secret and keystore file."
              exit 1
            fi

            local aliases
            aliases=$(keytool -list -v -keystore "$ks_file" -storepass "$ks_pw" 2>/dev/null | awk '
              /^Alias name:/ { sub(/^Alias name:[[:space:]]*/, ""); current_alias=$0 }
              tolower($0) ~ /^entry type:.*privatekeyentry/ { if (current_alias != "") print current_alias }
            ')
            if [ -z "$aliases" ]; then
              aliases=$(keytool -list -v -keystore "$ks_file" -storepass "$ks_pw" 2>/dev/null | awk '/^Alias name:/ { sub(/^Alias name:[[:space:]]*/, ""); print $0 }')
            fi

            local first_alias=""
            local preferred_exists=""

            while IFS= read -r candidate; do
              [ -z "$candidate" ] && continue
              [ -z "$first_alias" ] && first_alias="$candidate"
              if [ -n "$preferred_alias" ] && [ "$candidate" = "$preferred_alias" ]; then
                preferred_exists="$candidate"
              fi
              local cand_sha1
              cand_sha1=$(keytool -exportcert -rfc -keystore "$ks_file" -alias "$candidate" -storepass "$ks_pw" 2>/dev/null | openssl x509 -noout -fingerprint -sha1 2>/dev/null | cut -d'=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d ' \r\n' || true)
              echo "Detected keystore alias '${candidate}' -> SHA1: ${cand_sha1}"
            done <<< "$aliases"

            if [ -n "$preferred_exists" ]; then
              RESOLVED_ALIAS="$preferred_exists"
            elif [ -n "$preferred_alias" ] && keytool -list -keystore "$ks_file" -alias "$preferred_alias" -storepass "$ks_pw" >/dev/null 2>&1; then
              RESOLVED_ALIAS="$preferred_alias"
            elif [ -n "$first_alias" ]; then
              RESOLVED_ALIAS="$first_alias"
            else
              echo "ERROR: No PrivateKeyEntry alias found inside keystore! Note: Google Play .der files are public App Signing certificates — .aab signing requires a .jks/.p12 upload keystore."
              exit 1
            fi

            RESOLVED_SHA1=$(keytool -exportcert -rfc -keystore "$ks_file" -alias "$RESOLVED_ALIAS" -storepass "$ks_pw" 2>/dev/null | openssl x509 -noout -fingerprint -sha1 2>/dev/null | cut -d'=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d ' \r\n' || true)
          }

          # 2. Load persistent upload keystore from GitHub Secrets, android/signing/ file, or generate upload keystore
          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            if [ -z "$SECRET_KEYSTORE_PW" ]; then
              echo "ERROR: ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD secret is missing!"
              exit 1
            fi
            echo "Using persistent Android Upload Keystore from GitHub Secrets..."
            CLEAN_B64=$(printf '%s\n' "$SECRET_KEYSTORE_B64" | grep -v '^-----' | sed 's/^data:[^;]*;base64,//' | tr -d ' \t\n\r')
            printf '%s' "$CLEAN_B64" | base64 -d > "$KEYSTORE_FILE"

            resolve_keystore_alias_and_sha1 "$KEYSTORE_FILE" "$SECRET_KEYSTORE_PW" "$SECRET_KEY_ALIAS"
            FINAL_KEY_PW="${SECRET_KEY_PW:-$SECRET_KEYSTORE_PW}"

            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PW}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${RESOLVED_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${FINAL_KEY_PW}" >> $GITHUB_ENV
            echo "keystore_mode=secrets" >> $GITHUB_OUTPUT
            echo "signing_sha1=${RESOLVED_SHA1}" >> $GITHUB_OUTPUT
            echo "signing_alias=${RESOLVED_ALIAS}" >> $GITHUB_OUTPUT

            keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" -alias "$RESOLVED_ALIAS" -storepass "$SECRET_KEYSTORE_PW" -file "${GITHUB_WORKSPACE}/upload_certificate.pem" || true

          elif [ -n "$REPO_KEYSTORE_FILE" ]; then
            if [ -z "$SECRET_KEYSTORE_PW" ]; then
              echo "ERROR: Found keystore file in android/signing/, but ANDROID_KEYSTORE_PASSWORD secret is missing in GitHub Secrets!"
              exit 1
            fi
            echo "Using Android Upload Keystore from repository android/signing/ folder..."
            cp "$REPO_KEYSTORE_FILE" "$KEYSTORE_FILE"

            resolve_keystore_alias_and_sha1 "$KEYSTORE_FILE" "$SECRET_KEYSTORE_PW" "$SECRET_KEY_ALIAS"
            FINAL_KEY_PW="${SECRET_KEY_PW:-$SECRET_KEYSTORE_PW}"

            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PW}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${RESOLVED_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${FINAL_KEY_PW}" >> $GITHUB_ENV
            echo "keystore_mode=repo_file" >> $GITHUB_OUTPUT
            echo "signing_sha1=${RESOLVED_SHA1}" >> $GITHUB_OUTPUT
            echo "signing_alias=${RESOLVED_ALIAS}" >> $GITHUB_OUTPUT

            keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" -alias "$RESOLVED_ALIAS" -storepass "$SECRET_KEYSTORE_PW" -file "${GITHUB_WORKSPACE}/upload_certificate.pem" || true

          else
            echo "No GitHub signing secrets or android/signing/ keystore found — generating Play Console Upload Keystore for com.receiptscannerpro.app..."
            GEN_PW=$(openssl rand -hex 16)
            GEN_ALIAS="upload"
            echo "::add-mask::${GEN_PW}"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias "$GEN_ALIAS" \
              -storepass "$GEN_PW" \
              -keypass "$GEN_PW" \
              -dname "CN=ReceiptScannerPro, OU=Mobile, O=ReceiptScannerPro, L=Johannesburg, S=GP, C=ZA"

            RESOLVED_SHA1=$(keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" -alias "$GEN_ALIAS" -storepass "$GEN_PW" 2>/dev/null | openssl x509 -noout -fingerprint -sha1 2>/dev/null | cut -d'=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d ' \r\n' || true)

            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> $GITHUB_ENV
            echo "ANDROID_KEYSTORE_PASSWORD=${GEN_PW}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${GEN_ALIAS}" >> $GITHUB_ENV
            echo "ANDROID_KEY_PASSWORD=${GEN_PW}" >> $GITHUB_ENV
            echo "keystore_mode=generated" >> $GITHUB_OUTPUT
            echo "signing_sha1=${RESOLVED_SHA1}" >> $GITHUB_OUTPUT
            echo "signing_alias=${GEN_ALIAS}" >> $GITHUB_OUTPUT

            # Export public upload_certificate.pem
            keytool -exportcert -rfc -keystore "$KEYSTORE_FILE" -alias "$GEN_ALIAS" -storepass "$GEN_PW" -file "${GITHUB_WORKSPACE}/upload_certificate.pem"

            # Package private signing backup kit for authenticated Actions Artifact download
            mkdir -p "${GITHUB_WORKSPACE}/play-signing-kit"
            cp "$KEYSTORE_FILE" "${GITHUB_WORKSPACE}/play-signing-kit/upload-keystore.jks"
            cp "${GITHUB_WORKSPACE}/upload_certificate.pem" "${GITHUB_WORKSPACE}/play-signing-kit/upload_certificate.pem"
            B64_STR=$(base64 -w 0 "$KEYSTORE_FILE" 2>/dev/null || base64 "$KEYSTORE_FILE" | tr -d '\n')

            {
              echo "==================================================================="
              echo "PLAY CONSOLE UPLOAD KEYSTORE FOR com.receiptscannerpro.app"
              echo "==================================================================="
              echo "Upload Key SHA1 (signs .aab):       ${RESOLVED_SHA1}"
              echo "Play App Signing SHA1 (Google DER): AA:14:BE:52:28:F8:80:7C:13:DE:D0:86:F1:11:6A:0F:AE:93:17:4D"
              echo ""
              echo "IMPORTANT — SAVE THESE 4 SECRETS IN GITHUB SO FUTURE UPDATES USE THIS SAME UPLOAD KEY:"
              echo "  GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
              echo ""
              echo "1. ANDROID_KEYSTORE_BASE64"
              echo "${B64_STR}"
              echo ""
              echo "2. ANDROID_KEYSTORE_PASSWORD"
              echo "${GEN_PW}"
              echo ""
              echo "3. ANDROID_KEY_ALIAS"
              echo "${GEN_ALIAS}"
              echo ""
              echo "4. ANDROID_KEY_PASSWORD"
              echo "${GEN_PW}"
              echo "==================================================================="
            } > "${GITHUB_WORKSPACE}/play-signing-kit/GITHUB_SECRETS_SETUP.txt"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Make Gradle Wrapper Executable and Ensure Wrapper
        run: |
          chmod +x android/gradlew
          cd android
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading Gradle wrapper jar..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar || true
          fi

      - name: Build Signed Release Android App Bundle (.aab)
        run: |
          cd android
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          else
            gradle bundleRelease --no-daemon --stacktrace
          fi

      - name: Verify Signed App Bundle (.aab), R8 DEX Optimization & Native Debug Symbols
        run: |
          echo "=== Locating generated .aab file ==="
          AAB_SRC=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_SRC" ]; then
            echo "ERROR: No .aab bundle generated!"
            exit 1
          fi
          cp "$AAB_SRC" "${GITHUB_WORKSPACE}/ParserPro-release.aab"
          ls -lh "${GITHUB_WORKSPACE}/ParserPro-release.aab"

          echo "=== Verifying Release Cryptographic Signature ==="
          jarsigner -verify "${GITHUB_WORKSPACE}/ParserPro-release.aab"

          echo "=== Verifying Merged Manifest Package & Provider Authorities ==="
          MERGED_MANIFEST=$(find android/app/build/intermediates/merged_manifests/release -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$MERGED_MANIFEST" ]; then
            grep -q 'package="com.receiptscannerpro.app"' "$MERGED_MANIFEST"
            grep -q 'com.receiptscannerpro.app.fileprovider' "$MERGED_MANIFEST"
            grep -q 'com.receiptscannerpro.app.androidx-startup' "$MERGED_MANIFEST"
            if grep -qE 'com\.receiptscanner\.app|com\.cortech\.praiserpro' "$MERGED_MANIFEST"; then
              echo "ERROR: Legacy package or conflicting authority found in merged manifest!"
              exit 1
            fi
            echo "Verified package=com.receiptscannerpro.app and unique provider authorities!"
          fi

          echo "=== Verifying R8 DEX Code Optimization & Deobfuscation Mapping (mapping.txt) ==="
          MAPPING_OUT="${GITHUB_WORKSPACE}/mapping.txt"
          AGP_MAPPING=$(find android/app/build/outputs/mapping/release -name "mapping.txt" 2>/dev/null | head -n 1 || true)
          if [ -n "$AGP_MAPPING" ] && [ -s "$AGP_MAPPING" ]; then
            cp "$AGP_MAPPING" "$MAPPING_OUT"
            ls -lh "$MAPPING_OUT"
          elif unzip -Z1 "${GITHUB_WORKSPACE}/ParserPro-release.aab" 2>/dev/null | grep -q "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map"; then
            unzip -p "${GITHUB_WORKSPACE}/ParserPro-release.aab" "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map" > "$MAPPING_OUT"
            ls -lh "$MAPPING_OUT"
          else
            echo "ERROR: R8 DEX optimization mapping (mapping.txt / proguard.map) was not generated!"
            exit 1
          fi

          if ! unzip -Z1 "${GITHUB_WORKSPACE}/ParserPro-release.aab" 2>/dev/null | grep -q "BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map"; then
            echo "ERROR: proguard.map is missing from BUNDLE-METADATA inside ParserPro-release.aab!"
            exit 1
          fi
          echo "Verified R8 DEX code optimization and embedded BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map!"

          echo "=== Packaging Play Console Native Debug Symbols (native-debug-symbols.zip) ==="
          SYMBOLS_OUT="${GITHUB_WORKSPACE}/native-debug-symbols.zip"
          AGP_SYMBOLS=$(find android/app/build/outputs/native-debug-symbols/release -name "*.zip" 2>/dev/null | head -n 1 || true)
          MERGED_LIB_DIR=$(find android/app/build/intermediates/merged_native_libs/release -type d -name "lib" 2>/dev/null | head -n 1 || true)

          if [ -n "$AGP_SYMBOLS" ] && [ -f "$AGP_SYMBOLS" ] && unzip -Z1 "$AGP_SYMBOLS" 2>/dev/null | grep -qE '\.(so|dbg|sym)$'; then
            echo "Using AGP-generated native-debug-symbols.zip ($AGP_SYMBOLS)..."
            cp "$AGP_SYMBOLS" "$SYMBOLS_OUT"
          elif [ -n "$MERGED_LIB_DIR" ] && [ -d "$MERGED_LIB_DIR" ]; then
            echo "Packaging native debug symbols from merged_native_libs ($MERGED_LIB_DIR)..."
            python3 - "$MERGED_LIB_DIR" "$SYMBOLS_OUT" << 'PYEOF'
          import os, sys, zipfile
          lib_dir, out_zip = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(out_zip, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(lib_dir):
                  for fn in sorted(files):
                      if fn.endswith((".so", ".dbg", ".sym")):
                          full_path = os.path.join(root, fn)
                          rel_path = os.path.relpath(full_path, lib_dir).replace(os.sep, "/")
                          zf.write(full_path, arcname=rel_path)
          PYEOF
          elif [ -f "${GITHUB_WORKSPACE}/android/signing/native-debug-symbols.zip" ]; then
            echo "Using pre-packaged android/signing/native-debug-symbols.zip..."
            cp "${GITHUB_WORKSPACE}/android/signing/native-debug-symbols.zip" "$SYMBOLS_OUT"
          fi

          if [ -f "$SYMBOLS_OUT" ]; then
            ls -lh "$SYMBOLS_OUT"
            unzip -l "$SYMBOLS_OUT"
          fi

          echo "=== Checking Embedded Debug Symbols Inside .aab ==="
          unzip -l "${GITHUB_WORKSPACE}/ParserPro-release.aab" | grep "com.android.tools.build.debugsymbols" || echo "Note: Use standalone native-debug-symbols.zip if Play Console requests manual symbol upload."

      - name: Upload Play Console App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParserPro-PlayConsole-AAB
          path: ${{ github.workspace }}/ParserPro-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Upload Play Console R8 Deobfuscation Mapping (mapping.txt) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParserPro-R8-Deobfuscation-Mapping
          path: ${{ github.workspace }}/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Play Console Native Debug Symbols (.zip) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParserPro-Native-Debug-Symbols
          path: ${{ github.workspace }}/native-debug-symbols.zip
          retention-days: 90
          if-no-files-found: warn

      - name: Upload Private Play Signing Keystore Backup (First-Run Only)
        if: steps.signing_setup.outputs.keystore_mode == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: PlayConsole-Upload-Keystore-Backup-SAVE-THIS
          path: ${{ github.workspace }}/play-signing-kit/*
          retention-days: 90
          if-no-files-found: warn

      - name: Publish Direct 1-Click .aab, R8 Mapping & Native Debug Symbols to GitHub Releases
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-playstore-aab"
          AAB_PATH="${GITHUB_WORKSPACE}/ParserPro-release.aab"
          MAPPING_PATH="${GITHUB_WORKSPACE}/mapping.txt"
          SYMBOLS_PATH="${GITHUB_WORKSPACE}/native-debug-symbols.zip"
          PEM_PATH="${GITHUB_WORKSPACE}/upload_certificate.pem"
          SIGN_SHA1="${{ steps.signing_setup.outputs.signing_sha1 }}"
          PLAY_DEPLOY_SHA1="AA:14:BE:52:28:F8:80:7C:13:DE:D0:86:F1:11:6A:0F:AE:93:17:4D"

          if [ -f "$AAB_PATH" ]; then
            echo "Publishing Play Console AAB, R8 Mapping & Native Debug Symbols to GitHub Releases ($TAG_NAME)..."
            NOTES_FILE="${RUNNER_TEMP}/aab-release-notes.md"
            {
              echo "### Google Play Console Signed App Bundle (.aab), R8 DEX Optimization & Debug Symbols"
              echo "- **1-Click App Bundle (.aab)**: **[ParserPro-release.aab](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/ParserPro-release.aab)** *(R8 DEX-optimized + embedded proguard.map & native debug symbols)*"
              if [ -f "$MAPPING_PATH" ]; then
                echo "- **1-Click R8 Deobfuscation Mapping (.txt)**: **[mapping.txt](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/mapping.txt)**"
              fi
              if [ -f "$SYMBOLS_PATH" ]; then
                echo "- **1-Click Native Debug Symbols (.zip)**: **[native-debug-symbols.zip](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/native-debug-symbols.zip)**"
              fi
              if [ -f "$PEM_PATH" ]; then
                echo "- **Upload Certificate (.pem)**: **[upload_certificate.pem](https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/upload_certificate.pem)**"
              fi
              echo "- **Application ID**: \`com.receiptscannerpro.app\`"
              echo "- **DEX Optimization**: Enabled (\`R8 fullMode\`, \`minifyEnabled true\`, \`shrinkResources true\`, \`proguard-android-optimize.txt\`)"
              echo "- **Version Name**: \`${{ steps.signing_setup.outputs.version_name }}\` (\`versionCode ${{ steps.signing_setup.outputs.version_code }}\`)"
              echo "- **Bundle Upload Key SHA1**: \`${SIGN_SHA1}\`"
              echo "- **Play App Signing Certificate (\`deployment_cert.der\`) SHA1**: \`${PLAY_DEPLOY_SHA1}\`"
              echo "- **Built from commit**: \`${{ github.sha }}\`"
            } > "$NOTES_FILE"

            ASSETS=("$AAB_PATH")
            [ -f "$MAPPING_PATH" ] && ASSETS+=("$MAPPING_PATH")
            [ -f "$SYMBOLS_PATH" ] && ASSETS+=("$SYMBOLS_PATH")
            [ -f "$PEM_PATH" ] && ASSETS+=("$PEM_PATH")

            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber || echo "GitHub Release upload skipped"
              gh release edit "$TAG_NAME" --notes-file "$NOTES_FILE" || true
            else
              gh release create "$TAG_NAME" "${ASSETS[@]}" \
                --title "ParserPro Google Play Console Bundle (.aab), R8 Mapping & Debug Symbols" \
                --notes-file "$NOTES_FILE" \
                --prerelease || echo "GitHub Release creation skipped"
            fi
          fi

